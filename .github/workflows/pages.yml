name: Pages

# One site, one artifact: the landing page at the root, the dbt docs under /lineage/
# and the SPA on sample data under /demo/. Separate Pages workflows would overwrite
# each other's deploy.
on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'frontend/**'
      - 'pages/**'
      - 'docs/assets/curate.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read-only by default: the build job runs third-party code (pnpm and pip installs).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: dbt docs (lineage + column docs from CI fixtures; no production data)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          pip install -r requirements.txt
          dbt seed --target ci
          dbt run --target ci
          dbt docs generate --target ci --static

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The demo's music (made with Suno) lives in a release, not in git: 35 MB of mp3.
      - name: Demo audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download demo-audio-v1 --repo ${{ github.repository }} --dir frontend/demo-public/audio --pattern '*.mp3'
      - name: SPA demo (MSW in the browser, sample data)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo

      - name: Assemble the site
        run: |
          mkdir -p site/lineage site/demo
          cp pages/index.html site/index.html
          cp docs/assets/curate.png site/curate.png
          cp dbt/target/static_index.html site/lineage/index.html
          cp -R frontend/dist/. site/demo/
          # Pages has no SPA fallback: its 404 page is the demo app, whose asset URLs are
          # absolute, so deep links and refreshes under /demo/ still render.
          cp frontend/dist/index.html site/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
