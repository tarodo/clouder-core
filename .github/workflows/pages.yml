name: Pages

# One site, one artifact: the landing page at the root, the dbt docs under /lineage/
# and the SPA on sample data under /demo/. Separate Pages workflows would overwrite
# each other's deploy.
on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'frontend/**'
      - 'pages/**'
      - 'docs/assets/curate.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: dbt docs (lineage + column docs from CI fixtures; no production data)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          pip install -r requirements.txt
          dbt seed --target ci
          dbt run --target ci
          dbt docs generate --target ci --static

      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: SPA demo (MSW in the browser, sample data)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo

      - name: Assemble the site
        run: |
          mkdir -p site/lineage site/demo
          cp pages/index.html site/index.html
          cp docs/assets/curate.png site/curate.png
          cp dbt/target/static_index.html site/lineage/index.html
          cp -R frontend/dist/. site/demo/
          # Pages has no SPA fallback: its 404 page is the demo app, whose asset URLs are
          # absolute, so deep links and refreshes under /demo/ still render.
          cp frontend/dist/index.html site/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
