name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
      infra:    ${{ steps.filter.outputs.infra }}
      dbt:      ${{ steps.filter.outputs.dbt }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docs/api/openapi.yaml'
              - '.github/workflows/pr.yml'
            backend:
              - 'src/**'
              - 'tests/**'
              - 'alembic/**'
              - 'requirements*.txt'
              - 'requirements*.in'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'scripts/**'
              - '.github/workflows/pr.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/pr.yml'
            dbt:
              - 'dbt/**'
              - '.github/workflows/pr.yml'

  alembic-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        env:
          PYTHONPATH: src
          ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic upgrade head

      - name: Real-Postgres tests
        env:
          PYTHONPATH: src
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q tests/db

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    # The only job that talks to AWS; every other job installs third-party code
    # without the right to mint an OIDC token (ADR-0028).
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Before any AWS credentials exist: pip install runs third-party code.
      - name: Package Lambda
        working-directory: .
        run: scripts/package_lambda.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC)
        # Dependabot-triggered runs get no repository secrets: they validate without AWS (ADR-0028).
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        if: github.actor != 'dependabot[bot]'
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=clouder-core/prod/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Terraform init (no backend, Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform validate

      # The same inputs as deploy.yml, so the plan shows what the deploy would apply.
      - name: Terraform plan
        if: github.actor != 'dependabot[bot]'
        env:
          TF_VAR_spotify_oauth_redirect_uri: ${{ vars.SPOTIFY_OAUTH_REDIRECT_URI }}
          TF_VAR_admin_spotify_ids: ${{ vars.ADMIN_SPOTIFY_IDS }}
          TF_VAR_allowed_frontend_redirects: ${{ vars.ALLOWED_FRONTEND_REDIRECTS }}
          TF_VAR_beatport_client_id: ${{ secrets.BEATPORT_CLIENT_ID }}
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
          TF_VAR_budget_monthly_limit: ${{ secrets.BUDGET_MONTHLY_LIMIT }}
        run: terraform plan -input=false -lock=false -var-file=prod.tfvars

  dbt:
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dbt
        run: pip install -r requirements.txt
      - name: Build and test on DuckDB (fixtures, unit + data tests)
        # Unit tests read the columns of `this`: create empty relations first.
        run: |
          dbt seed --target ci
          dbt run --target ci --empty
          dbt build --target ci --full-refresh --exclude resource_type:seed
      - name: Parse the Athena target
        run: dbt parse --target prod

  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"  # the lock header and output format must not drift

      - name: Locks match their .in files
        run: |
          uv pip compile --universal --python-version 3.12 requirements-lambda.in -o requirements-lambda.txt -q
          uv pip compile --universal --python-version 3.12 requirements-dev.in -o requirements-dev.txt -q
          git diff --exit-code requirements-lambda.txt requirements-dev.txt

      - name: Python vulnerabilities
        run: uvx pip-audit -r requirements-lambda.txt -r requirements-dev.txt --progress-spinner off

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Frontend runtime vulnerabilities (dev-only ones go to Dependabot)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy

  tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage (gate in pyproject.toml)
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          pytest -q --cov --cov-report=term | tee pytest.log
          grep -E '^TOTAL|Required test coverage' pytest.log >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated API types are fresh
        run: |
          pnpm api:types
          if ! git diff --quiet src/api/schema.d.ts; then
            echo "::error::src/api/schema.d.ts is out of sync with docs/api/openapi.yaml — run pnpm api:types"
            git --no-pager diff src/api/schema.d.ts
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Production bundle carries no demo code
        run: |
          if grep -rqE "mockServiceWorker|setupWorker" dist; then
            echo "::error::the demo (MSW) leaked into the production bundle"
            exit 1
          fi
      - run: pnpm build:demo
