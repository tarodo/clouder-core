name: dbt docs

on:
  push:
    branches: [main]
    paths: ['dbt/**', '.github/workflows/dbt-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build fixtures and generate docs (lineage + column docs; no production data)
        run: |
          dbt seed --target ci
          dbt run --target ci
          dbt docs generate --target ci --static
          mkdir -p site && cp target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dbt/site
      - id: deploy
        uses: actions/deploy-pages@v5
