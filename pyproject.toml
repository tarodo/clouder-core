[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["graphify-out", "experiments", "frontend", "dbt", "alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# B904/B905: raise-from and zip(strict=) are style changes across ~40 call sites.
# UP042: StrEnum changes str() and f-string output of members.
ignore = ["B904", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Local helpers before imports are fine in tests; a nested `pytest.raises` scopes the one call that raises.
"tests/**" = ["B011", "B017", "E402", "SIM117"]
"src/collector/*/prompts/**" = ["RUF001", "RUF002"]  # LLM prompt text uses typographic characters on purpose

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/collector"]

[tool.coverage.run]
source = ["src/collector"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true
