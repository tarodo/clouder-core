version: 2

models:
  - name: fct_play
    description: >
      One row per play: playing stretches (play/resume up to the user's next playback
      event) capped at the track's duration, 10-minute fallback for unknown durations —
      the same rule as the analytics Lambda. style_id is the track's style as of the
      play date (the earliest known version for plays before history starts).
    columns:
      - name: play_event_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests: [not_null]
      - name: ms
        data_tests: [not_null]

unit_tests:
  - name: fct_play_follows_the_play_rule
    model: fct_play
    description: >
      The play rule's contract. tests/unit/test_analytics_play_contract.py runs the
      same rows through the analytics Lambda's SQL and expects the same plays, so the
      rule cannot change in one of the two places alone.
    given:
      - input: ref('events')
        rows:
          # pause -> resume -> ended: only the playing stretches count (60s + 90s)
          - {event_id: a1, user_id: u1, dt: '2026-10-04', event_name: playback_play, track_id: t1, source: triage_player, duration_ms: 300000, ts_client: '2026-10-04T10:00:00.000Z', ts_client_utc: '2026-10-04 10:00:00'}
          - {event_id: a2, user_id: u1, dt: '2026-10-04', event_name: playback_pause, track_id: t1, source: triage_player, duration_ms: null, ts_client: '2026-10-04T10:01:00.000Z', ts_client_utc: '2026-10-04 10:01:00'}
          - {event_id: a3, user_id: u1, dt: '2026-10-04', event_name: playback_resume, track_id: t1, source: triage_player, duration_ms: null, ts_client: '2026-10-04T10:05:00.000Z', ts_client_utc: '2026-10-04 10:05:00'}
          - {event_id: a4, user_id: u1, dt: '2026-10-04', event_name: playback_ended, track_id: t1, source: triage_player, duration_ms: null, ts_client: '2026-10-04T10:06:30.000Z', ts_client_utc: '2026-10-04 10:06:30'}
          # no pause / ended (older data): runs to the next play
          - {event_id: b1, user_id: u1, dt: '2026-10-04', event_name: playback_play, track_id: t2, source: category_player, duration_ms: 300000, ts_client: '2026-10-04T10:10:00.000Z', ts_client_utc: '2026-10-04 10:10:00'}
          # 8 min to the next play: capped at the 60s duration
          - {event_id: c1, user_id: u1, dt: '2026-10-04', event_name: playback_play, track_id: t3, source: category_player, duration_ms: 60000, ts_client: '2026-10-04T10:12:00.000Z', ts_client_utc: '2026-10-04 10:12:00'}
          # same ts_client: event_id orders play before ended -> 0 ms
          - {event_id: d1, user_id: u1, dt: '2026-10-04', event_name: playback_play, track_id: t4, source: playlist_player, duration_ms: 200000, ts_client: '2026-10-04T10:20:00.000Z', ts_client_utc: '2026-10-04 10:20:00'}
          - {event_id: d2, user_id: u1, dt: '2026-10-04', event_name: playback_ended, track_id: t4, source: playlist_player, duration_ms: null, ts_client: '2026-10-04T10:20:00.000Z', ts_client_utc: '2026-10-04 10:20:00'}
          # unknown duration: 20 min to the next play, capped at the 10-min fallback
          - {event_id: e1, user_id: u1, dt: '2026-10-04', event_name: playback_play, track_id: t5, source: triage_player, duration_ms: 0, ts_client: '2026-10-04T10:30:00.000Z', ts_client_utc: '2026-10-04 10:30:00'}
          # unparsable client clock: dropped, not a play
          - {event_id: f1, user_id: u1, dt: '2026-10-04', event_name: playback_play, track_id: t7, source: triage_player, duration_ms: 300000, ts_client: 'not-a-date', ts_client_utc: null}
          # last play, nothing after it: the whole duration
          - {event_id: g1, user_id: u1, dt: '2026-10-04', event_name: playback_play, track_id: t6, source: triage_player, duration_ms: 300000, ts_client: '2026-10-04T10:50:00.000Z', ts_client_utc: '2026-10-04 10:50:00'}
          # another user, interleaved with u1; a resume before any play is dropped
          - {event_id: h0, user_id: u2, dt: '2026-10-04', event_name: playback_resume, track_id: t8, source: playlist_player, duration_ms: null, ts_client: '2026-10-04T09:59:00.000Z', ts_client_utc: '2026-10-04 09:59:00'}
          - {event_id: h1, user_id: u2, dt: '2026-10-04', event_name: playback_play, track_id: t8, source: playlist_player, duration_ms: 240000, ts_client: '2026-10-04T10:00:30.000Z', ts_client_utc: '2026-10-04 10:00:30'}
          - {event_id: h2, user_id: u2, dt: '2026-10-04', event_name: playback_ended, track_id: t8, source: playlist_player, duration_ms: null, ts_client: '2026-10-04T10:03:30.000Z', ts_client_utc: '2026-10-04 10:03:30'}
      - input: ref('dim_track_history')
        rows: []
    expect:
      rows:
        - {user_id: u1, track_id: t1, stage: triage_player, played_at: '2026-10-04 10:00:00', ms: 150000}
        - {user_id: u1, track_id: t2, stage: category_player, played_at: '2026-10-04 10:10:00', ms: 120000}
        - {user_id: u1, track_id: t3, stage: category_player, played_at: '2026-10-04 10:12:00', ms: 60000}
        - {user_id: u1, track_id: t4, stage: playlist_player, played_at: '2026-10-04 10:20:00', ms: 0}
        - {user_id: u1, track_id: t5, stage: triage_player, played_at: '2026-10-04 10:30:00', ms: 600000}
        - {user_id: u1, track_id: t6, stage: triage_player, played_at: '2026-10-04 10:50:00', ms: 300000}
        - {user_id: u2, track_id: t8, stage: playlist_player, played_at: '2026-10-04 10:00:30', ms: 180000}

  - name: fct_play_uses_the_style_as_of_the_play
    model: fct_play
    given:
      - input: ref('events')
        rows:
          - {event_id: before, user_id: u1, event_name: playback_play, track_id: t1, source: triage_player, duration_ms: 1000, ts_client_utc: '2026-09-01 10:00:00'}
          - {event_id: during, user_id: u1, event_name: playback_play, track_id: t1, source: triage_player, duration_ms: 1000, ts_client_utc: '2026-10-04 10:00:00'}
          - {event_id: after, user_id: u1, event_name: playback_play, track_id: t1, source: triage_player, duration_ms: 1000, ts_client_utc: '2026-10-06 10:00:00'}
      - input: ref('dim_track_history')
        rows:
          - {track_id: t1, valid_from: '2026-10-03', valid_to: '2026-10-05', style_id: s1}
          - {track_id: t1, valid_from: '2026-10-05', valid_to: null, style_id: s2}
    expect:
      rows:
        - {play_event_id: before, style_id: s1}
        - {play_event_id: during, style_id: s1}
        - {play_event_id: after, style_id: s2}
